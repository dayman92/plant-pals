<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F28C28">
  <!-- Tells Chrome (incl. Android's "dark theme for sites") that we handle dark mode ourselves,
       so it must not auto-darken/invert the page and plant drawings. -->
  <meta name="color-scheme" content="light dark">
  <script>
    // Apply the theme before first paint. Setting: 'auto' (follow phone) | 'light' | 'dark'.
    (function () {
      var pref = 'auto';
      try { pref = localStorage.getItem('plantPals.theme') || 'auto'; } catch (e) {}
      var mq = window.matchMedia('(prefers-color-scheme: dark)');
      function apply() { document.documentElement.setAttribute('data-theme', pref === 'auto' ? (mq.matches ? 'dark' : 'light') : pref); }
      apply();
      if (mq.addEventListener) mq.addEventListener('change', function () { if (pref === 'auto') apply(); });
      window.PlantTheme = {
        get: function () { return pref; },
        set: function (v) { pref = v; try { localStorage.setItem('plantPals.theme', v); } catch (e) {} apply(); },
      };
    })();
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Plant Pals</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <!-- Everything is local: no fonts, scripts or trackers are loaded from other sites. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <link rel="preload" href="fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button id="help-btn" class="help-btn" aria-label="Watering guide">?</button>
      <h1 id="screen-title">Today</h1>
      <p id="screen-subtitle" class="subtitle"></p>
    </header>

    <main id="screen" class="screen" aria-live="polite"></main>

    <button id="fab" class="fab" aria-label="Add">＋</button>

    <nav class="tabbar" aria-label="Main">
      <button class="tab is-active" data-tab="today"><span class="tab-icon"><span class="tab-emoji">💧</span><span id="today-badge" class="badge" hidden></span></span>Today</button>
      <button class="tab" data-tab="plants"><span class="tab-icon"><span class="tab-emoji">🪴</span></span>My plants</button>
      <button class="tab" data-tab="rooms"><span class="tab-icon"><span class="tab-emoji">🏠</span></span>Rooms</button>
      <button class="tab" data-tab="settings"><span class="tab-icon"><span class="tab-emoji">⚙️</span></span>Settings</button>
    </nav>
  </div>

  <!-- Bottom sheet used for every add/edit form -->
  <div id="sheet-backdrop" class="sheet-backdrop" hidden></div>
  <section id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
    <div class="sheet-handle"></div>
    <h2 id="sheet-title"></h2>
    <div id="sheet-body"></div>
  </section>

  <!-- Watering guide: its own layer so it can open on top of a form without losing edits -->
  <section id="guide" class="guide" role="dialog" aria-modal="true" aria-labelledby="guide-title" hidden>
    <header class="guide-head">
      <h2 id="guide-title">Watering guide</h2>
      <button class="guide-close" id="guide-close" aria-label="Close guide">✕</button>
    </header>
    <div id="guide-body" class="guide-body"></div>
  </section>

  <div id="toast" class="toast" role="status" hidden></div>
  <input id="import-file" type="file" accept="application/json,.json" hidden>


  <script src="js/catalog.js"></script>
  <script src="js/watering.js"></script>
  <script src="js/plant-art.js"></script>
  <script src="js/store.js"></script>
  <script src="js/native.js"></script>
  <script src="js/app.js"></script>
  <script>
    // The Android app ships its files inside the APK, so only the web version needs the offline cache.
    if ('serviceWorker' in navigator && window.isSecureContext && location.protocol !== 'file:' && !Native.isApp) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
