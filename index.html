<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F28C28">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Plant Pals</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1 id="screen-title">Today</h1>
      <p id="screen-subtitle" class="subtitle"></p>
    </header>

    <main id="screen" class="screen" aria-live="polite"></main>

    <button id="fab" class="fab" aria-label="Add">＋</button>

    <nav class="tabbar" aria-label="Main">
      <button class="tab is-active" data-tab="today"><span class="tab-icon"><span class="tab-emoji">💧</span><span id="today-badge" class="badge" hidden></span></span>Today</button>
      <button class="tab" data-tab="plants"><span class="tab-icon"><span class="tab-emoji">🪴</span></span>My plants</button>
      <button class="tab" data-tab="rooms"><span class="tab-icon"><span class="tab-emoji">🏠</span></span>Rooms</button>
    </nav>
  </div>

  <!-- Bottom sheet used for every add/edit form -->
  <div id="sheet-backdrop" class="sheet-backdrop" hidden></div>
  <section id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
    <div class="sheet-handle"></div>
    <h2 id="sheet-title"></h2>
    <div id="sheet-body"></div>
  </section>

  <div id="toast" class="toast" role="status" hidden></div>
  <input id="import-file" type="file" accept="application/json,.json" hidden>


  <script src="js/catalog.js"></script>
  <script src="js/watering.js"></script>
  <script src="js/plant-art.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator && window.isSecureContext && location.protocol !== 'file:') {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
